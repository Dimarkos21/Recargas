     <h1 > Presupuesto</h1>
  <div class="document">
        <div class="wave-top-bg"></div>
        <div class="wave-top-line"></div>

        <header class="header">
            <div class="logo-box">
                <div class="logo-text"> <img id="Loguio"></div>
                <div class="rif">RIF: J12345678</div>
               
            </div>
            <div class="date-input">
                <label>Fecha:</label>
                <input type="text" id="fecha" class="line-input" placeholder="dd/mm/aaaa" disabled >
            </div>
        </header>

        <h1 class="title" >PRESUPUESTO PARA LENTES</h1>

        <section class="form-container">
            <div class="row">
                <label>Nombres y apellidos:</label >
                <input type="text" class="line-input" id="nombre-pellido" required>
            </div>

            <div class="row grid-3">
                <div class="field"><label>Edad:</label><input type="number" class="line-input" id="Edad" required></div>
                <div class="field"><label>Teléfono:</label><input type="number" class="line-input" id="Telefono" required></div>
                <div class="field"><label>Cédula:</label><input type="text" class="line-input" id="Cedula" required></div>
            </div>

            <div class="row"><label>Dirección:</label><input type="text" class="line-input" id="Direccion" required></div>

            <div class="row-stack">
                <label>Resultados de evaluación visual del paciente:</label>
                <input type="text" class="line-input full-width" id="Resultados" required>

            </div>

            <div class="row half-width"><label>Montura:</label><input type="text" class="line-input" id="Montura" required></div>
            <div class="row half-width"><label>Cristales:</label><input type="text" class="line-input" id="Cristales" required></div>

            <div class="row cost-row">
                <label>Costo total en divisa $:</label>
                <input type="number" class="line-input small" id="Costo" required>
                <span>equivalente a tasa BCV del día de su pago.</span>
            </div>
        </section>

        <section class="payment-details">
          
        </section>

        <div class="footer-wave-bg"></div>
        <div class="footer-wave-line"></div>
        <footer class="footer-info">
