        <div id="modal-gestion-pedido" class="modal-overlay">
  <div class="modal-container">
    
    <div class="modal-header">
      <h3>Actualizar Estado del Pedido</h3>
      <button id="btn-cerrar-modal" class="modal-close-x">&times;</button>
    </div>
    
    <div class="modal-body">
      <p class="modal-subtitle">Paciente: <strong id="modal-paciente-nombre">Arturo Contreras</strong></p>
      
      <div class="flujo-estados">
        <div class="estado-nodo" id="nodo-Pedir">
          <span class="nodo-dot dot-pending"></span>
          <small>Por Pedir</small>
        </div>
        <div class="flujo-flecha">&rarr;</div>
        <div class="estado-nodo" id="nodo-enLaboratorio">
          <span class="nodo-dot dot-lab"></span>
          <small>En Laboratorio</small>
        </div>
        <div class="flujo-flecha">&rarr;</div>
        <div class="estado-nodo" id="nodo-Completado">
          <span class="nodo-dot dot-completed"></span>
          <small>Completado</small>
        </div>
          <div class="flujo-flecha">&rarr;</div>
          <div class="estado-nodo" id="nodo-Entregado">
          <span class="nodo-dot dot-Entregado"></span>
          <small>Entregado</small>
        </div>
      </div>

      <div class="alerta-accion">
        <p id="modal-mensaje-accion">¿Deseas enviar este pedido al <strong>Laboratorio</strong> para iniciar su fabricación?</p>
      </div>
    </div>
    
    <div class="modal-footer">
      <button id="btn-cancelar-modal" class="btn-modal btn-secondary">Volver</button>
      <button id="btn-confirmar-modal" class="btn-modal btn-primary">Aceptar y Mover</button>
    </div>
