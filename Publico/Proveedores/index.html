<div id="form-proveedor" class="container-form">
    <h3>Registro de Precios - Catálogo de Cristales</h3>
    <p><small>Basado en Lista Global Lens Enero 2026</small></p>
    
    <hr>
    
    <div class="input-group">
        <label>Nombre del Cristal / Descripción:</label>
        <input type="text" id="descCristal" placeholder="Ej: CR 39 1,49 (Plano A +/-4,00 ESF)" class="input-datos">
    </div>

    <div class="input-group">
        <label>Tipo de Lente:</label>
        <select id="tipoLente" class="input-datos">
            <option value="VS">Visión Sencilla</option>
            <option value="BIF">Bifocal</option>
            <option value="PROG">Progresivo</option>
        </select>
    </div>

    <div style="display: flex; gap: 10px;">
        <div style="flex: 1;">
            <label>Rango Esfera (ESF):</label>
            <input type="text" id="rangoEsf" placeholder="Ej: Plano a +/-4.00" class="input-datos">
        </div>
        <div style="flex: 1;">
            <label>Rango Cilindro (CYL):</label>
            <input type="text" id="rangoCyl" placeholder="Ej: -2.00" class="input-datos">
        </div>
    </div>

    <hr>

    <div style="display: flex; gap: 10px; align-items: center;">
        <div style="flex: 1;">
            <label>Costo Mayor ($ por par):</label>
            <input type="number" step="0.01" id="costoMayor" placeholder="Ej: 2.50" class="input-datos">
        </div>
        <div style="flex: 1;">
            <label>Precio Venta Sugerido ($):</label>
            <input type="number" step="0.01" id="precioVenta" placeholder="Ej: 10.00" class="input-datos">
        </div>
    </div>

    <div id="container-boton" style="margin-top: 20px;">
        <button id="guardarCristal" class="btn-guardar">
            <lord-icon src="https://cdn.lordicon.com/hrc5vovm.json" trigger="hover" style="width:30px;height:30px"></lord-icon>
            Guardar en Catálogo
        </button>
    </div>
</div>
<div id="form-import-pdf" class="container-form-pdf">
    <div class="header-pdf">
        <lord-icon src="https://cdn.lordicon.com/vfyabpfd.json" trigger="loop" style="width:40px;height:40px"></lord-icon>
        <h3>Importar Tarifario de Proveedor</h3>
    </div>

    <div class="row-pdf">
        <div class="input-group-pdf">
            <label for="select-proveedor">Seleccionar Proveedor:</label>
            <select id="select-proveedor" class="input-datos">
                <option value="global_lens">Global Lens</option>
                <option value="remi">Remi</option>
                <option value="otros">Otros</option>
            </select>
        </div>
        <div class="input-group-pdf">
            <label for="mes-vigencia">Mes de Vigencia:</label>
            <input type="month" id="mes-vigencia" class="input-datos" value="2026-01">
        </div>
    </div>

    <label for="file-input" id="drop-zone-tarifario" class="drop-zone">
        <input type="file" id="file-input" accept="application/pdf" style="position: absolute; opacity: 0; width: 1px; height: 1px;">
        
        <div class="drop-zone-content" id="drop-zone-prompt">
            <lord-icon src="https://cdn.lordicon.com/nocovpqy.json" trigger="hover" style="width:60px;height:60px"></lord-icon>
            <p>Arrastra la lista de precios aquí o <span>haz clic para buscar</span></p>
            <small>Solo archivos .PDF</small>
        </div>

        <div id="file-info" class="file-info" style="display: none; flex-direction: column; align-items: center;">
            <lord-icon src="https://cdn.lordicon.com/asfiphwa.json" trigger="loop" style="width:50px;height:50px"></lord-icon>
            <p id="file-name" style="font-weight: bold; margin-top: 10px; color: #2ecc71;"></p>
            <span style="font-size: 0.8rem; color: #666;">(Haz clic para cambiar el archivo)</span>
        </div>
    </label>

    <div class="footer-buttons">
        <button id="btn-cancelar-carga" class="btn-secundario">Cancelar</button>
        <button id="btn-procesar-lista" class="btn-primario">
            Procesar Lista de Precios
        </button>
    </div>
</div>
