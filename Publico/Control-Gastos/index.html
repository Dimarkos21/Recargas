<div class="main-container">
        <h1>Control de Gastos</h1>
        
        <div class="balance-box">
            <h2>Balance Total</h2>
           <p id="total-balance">$0.00</p>
                   <p id="total-bs">0.00bs</p>
        </div>

        <form id="form" class="gasto-form">
        <div class="form-row">
            <input type="text" id="nombre" placeholder="nombre del gasto..." class="input-concepto">
            <input  id="precio"  inputmode="decimal" placeholder="precio" class="input-cantidad">
        </div>

        <div class="categorias-grid">
            <button type="button" class="categoria-btn" data-id="Inventario">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M21 9H3v6h18V9M3 7h18a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V9c0-1.1.9-2 2-2m2 4h4v2H5v-2m6 0h4v2h-4v-2m6 0h2v2h-2v-2z"/></svg>
                Inventario
            </button>
            <button type="button" class="categoria-btn" data-id="Personal">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4m0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                Personal
            </button>
            <button type="button" class="categoria-btn" data-id="Servicios">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C7 2 3 6 3 11c0 3.5 2.1 6.5 5 8v2c0 .6.4 1 1 1h6c.6 0 1-.4 1-1v-2c2.9-1.5 5-4.5 5-8 0-5-4-9-9-9m1 19h-2v-1.5h2V21m0-3h-2v-1.5h2V18m0-3h-2v-1.5h2V15z"/></svg>
                Servicios
            </button>
            <button type="button" class="categoria-btn active" data-id="Arriendo">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2m0-4H4v-2h2v2m0-4H4V9h2v2m0-4H4V5h2v2m4 12H8v-2h2v2m0-4H8v-2h2v2m0-4H8V9h2v2m0-4H8V5h2v2m10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10z"/></svg>
                Arriendo
            </button>
            <button type="button" class="categoria-btn" data-id="Otros">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-2 .89-2 2v11c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2m-6 0h-4V4h4v2z"/></svg>
                Otros
            </button>
        </div>

        <button type="submit" class="submit-btn" id="BUTTONREGISTRO">Registrar Gasto</button>
