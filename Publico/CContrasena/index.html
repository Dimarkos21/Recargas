<body>

    <nav id="barra">
        
        <button id="Inventary"><h1>OptiGest</h1></button>
        <a href="/login"><button id="boton">Iniciar sesión</button></a>
    </nav>

    <div id="notificacion"></div>
    
    <div id="container-1container">
        <div class="contenedor">
            <form id="contenedor1">
                <h2  id='titulo'style="font-family: 'Oswald'; color: #333;">Nueva Contraseña</h2>
                <input type="password" class="input" placeholder="Nueva contraseña" id="pass1" required>
                <input type="password" class="input" placeholder="Confirmar contraseña" id="pass2" required>
                <button type="submit" id="boton">Actualizar</button>
            </form>
        </div>
    </div>

    <script src="/dist/CContrasena/index.min.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('✅ App lista: ', reg.scope))
                    .catch(err => console.error('❌ Error SW: ', err));
            });
        }
    </script>
